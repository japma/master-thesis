[project]
name = "master-thesis"
version = "0.1.0"
description = "Master Thesis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "fiftyone>=1.16.0",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pycocotools==2.0.11",
    "pyyaml>=6.0",
    "rtpt>=0.0.4",
    "spflow>=1.1.0",
    "torch>=2.12.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "umap-learn>=0.5.12",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pyrefly>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "data", "training", "utils", "scripts"]
