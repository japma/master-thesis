[project]
name = "master-thesis"
version = "0.1.0"
description = "Master Thesis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "fiftyone>=1.16.0",
    "gdown>=6.1.0",
    "hf>=1.20.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "lpips>=0.1.4",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pycocotools==2.0.11",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "rtpt>=0.0.4",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "spflow>=1.1.0",
    "torch>=2.12.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "umap-learn>=0.5.12",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pyrefly>=1.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
train_ae = "scripts.train_ae:main"
train_cspn = "scripts.train_cspn:main"
download_data = "scripts.download_data:main"
generate_colour_mnist = "scripts.generate_colour_mnist:main"
list_checkpoints = "scripts.list_checkpoints:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "dataset_loaders", "training", "utils", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F",
    "I",
    "B",
    "UP",
    "RUF",
    "SIM",
    "C4",
    "N",
]
ignore = [
    "N803",
    "N812",
    "N806",
    "E501",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
