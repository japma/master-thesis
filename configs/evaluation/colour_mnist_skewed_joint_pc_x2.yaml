# The joint PC trained on colour_mnist_skewed_x2 (twice the training data), for
# `diagnose_joint_pc`.

type: evaluation

dataset:
  name: colour_mnist_skewed

model:
  name: joint_pc_colour_mnist_skewed_x2
  model_type: joint_pc
  tag: latest

# Unpinned on purpose: the decoder is whichever autoencoder this checkpoint records
# being trained against, so the latents always fit.

classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 0.5
  batch_size: 256

evaluation:
  batch_size: 512
  results_root: results
