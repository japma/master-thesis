# The mixture neural baseline on skewed colour-MNIST.
#
# A mixture density head: it *can* represent a multimodal p(z|y), so it is the fair
# neural comparison for a circuit.
#
# Same dataset, judge and queries as the CSPN config, so rows land beside it in
# results/*.csv and compare directly.

type: evaluation

dataset:
  name: colour_mnist_skewed

model:
  name: nn_baseline_colour_mnist_skewed_mixture
  model_type: nn_baseline
  tag: latest

# Left unpinned on purpose: the decoder is whichever autoencoder this checkpoint
# records being trained against, so the latents always fit. Pin it only to override:
# autoencoder: { name: variational_colour_mnist_skewed, external: false, tag: latest }

# Deliberately the uniform judge for every variant, so it is not itself weaker on
# combinations the model under test never saw.
classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 1.0
  batch_size: 256

evaluation:
  batch_size: 512
  results_root: results
  # Every metric in `evaluation/metrics/` runs by default. Pin a subset to run only
  # those, e.g.
  # metrics: [colour_accuracy, colour_accuracy_by_combination]

# Read only by `evaluate_marginal`: queries with a factor left to the model.
# [digit, fg, bg]; -1 marginalizes that factor. fg indices are
# red green blue cyan yellow pink; bg indices are white black grey.
marginal:
  queries:
    - [0, -1, -1]   # the skewed digit: p(fg | 0) leans red
    - [1, -1, -1]   # control: digit 1 is uniform over the six foregrounds
    - [0, 0, -1]    # a red 0, background free
  n_per_query: 1000
