# The don't-care CSPN on skewed colour-MNIST: the third arm of the calibration
# comparison, beside the mixture reference and the joint PC's exact marginal.
#
# Same dataset, same judge, same queries as colour_mnist_skewed.yaml -- only the model
# differs, so the two are directly comparable row by row in results/*.csv.

type: evaluation

dataset:
  name: colour_mnist_skewed

model:
  name: psinet_colour_mnist_skewed_dontcare
  model_type: cspn
  tag: latest

# Unpinned on purpose: the decoder is whichever autoencoder this checkpoint records
# being trained against, so the latents always fit.

classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 0.5
  batch_size: 256
  output_root: results/samples

evaluation:
  batch_size: 512
  results_root: results

marginal:
  queries:
    - [ 0, -1, -1 ]   # the skewed digit: p(fg | 0) leans red
    - [ 1, -1, -1 ]   # control: digit 1 is uniform over the six foregrounds
    - [ 0, 0, -1 ]    # a red 0, background free
  n_per_query: 1000
