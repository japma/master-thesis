# The joint PC on correlated colour-MNIST, for `diagnose_joint_pc`. Marginal queries live
# in configs/pools/colour_mnist_correlated.yaml.

type: evaluation

dataset:
  name: colour_mnist_correlated

model:
  name: joint_pc_colour_mnist_correlated_variational
  model_type: joint_pc
  tag: latest

# Unpinned on purpose: the decoder is whichever autoencoder this checkpoint records
# being trained against, so the latents always fit.

# Deliberately the uniform judge for every variant, so it is not itself biased towards
# the combinations this variant over-represents.
classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 0.5
  batch_size: 256

evaluation:
  batch_size: 512
  results_root: results
