# The joint PC trained on colour_mnist_uniform_x2 (twice the training data), scored
# against colour_mnist_uniform: val is identical, so its rows sit beside the baseline
# joint PC in results/*.csv and the figures.

type: evaluation

dataset:
  name: colour_mnist_uniform

model:
  name: joint_pc_colour_mnist_uniform_x2
  model_type: joint_pc
  tag: latest

classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 1.0
  batch_size: 256
  output_root: results/samples

evaluation:
  batch_size: 512
  results_root: results
