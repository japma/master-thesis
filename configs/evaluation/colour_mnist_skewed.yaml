# Generation + classifier evaluation for the skewed colour-MNIST variant.
# Both stages read this file: generate_samples writes the pool, evaluate_samples scores it.

type: evaluation

dataset:
  name: colour_mnist_skewed

model:
  name: psinet_colour_mnist_skewed
  model_type: cspn
  tag: latest

# Left unpinned on purpose: the decoder is whichever autoencoder this checkpoint
# records being trained against, so the latents always fit. Pin it only to override:
# autoencoder: { name: variational_colour_mnist_skewed, external: false, tag: latest }

# Deliberately the uniform judge for every variant, so it is not itself weaker on
# combinations the model under test never saw.
classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 1.0
  batch_size: 256
  output_root: results/samples

evaluation:
  batch_size: 512
  results_root: results
