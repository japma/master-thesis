# Generation + classifier evaluation for the uniform colour-MNIST variant.
# Both stages read this file: generate_samples writes the pool, evaluate_samples scores it.

type: evaluation

dataset:
  name: colour_mnist_uniform

model:
  name: psinet_colour_mnist_uniform
  model_type: cspn
  tag: latest

# Left unpinned on purpose: the decoder is whichever autoencoder this checkpoint
# records being trained against, so the latents always fit. Pin it only to override:
# autoencoder: { name: variational_colour_mnist_uniform, external: false, tag: latest }

classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

generation:
  n_per_cell: 100
  seed: 0
  std_correction: 1.0
  batch_size: 256
  output_root: results/samples

evaluation:
  batch_size: 512
  results_root: results
  # Every metric in `evaluation/metrics/` runs by default. Pin a subset to run only
  # those, e.g.
  # metrics: [colour_accuracy, colour_accuracy_by_combination]

# Read only by `evaluate_marginal`. Every conditional here is uniform, so this measures
# the noise floor (~0.01) rather than a result -- and catches collapse.
marginal:
  queries:
    - [0, -1, -1]
    - [5, -1, -1]
  n_per_query: 1000
