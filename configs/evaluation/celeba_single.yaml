# CelebA with a single binary attribute (Male), otherwise identical to celeba.yaml.
#
# Two things differ from the colour-MNIST configs, and both follow from the label space.
# CelebA has 40 binary attributes -- 2^40 combinations -- so the generation schedule
# draws whole label rows from the training split instead of enumerating cells. And there
# is no judge: `evaluate_samples` would have nothing to score, so stage 2 is
# `evaluate_sets`.
#
#   uv run generate_samples configs/evaluation/celeba.yaml
#   uv run evaluate_sets    configs/evaluation/celeba.yaml
#
# The set metrics say a set of images looks like CelebA (and, with recall, covers it);
# they say nothing about whether a sample carries the attributes it was conditioned on.
# An attribute judge is the obvious next one -- see the note at the bottom.

type: evaluation

dataset:
  name: celeba_single_attribute

model:
  name: psinet_celeba_single_attribute
  model_type: cspn
  tag: latest

# Unpinned on purpose: the decoder is whichever autoencoder this checkpoint records
# being trained against, so the latents always fit.

# No `classifier:` -- nothing here is judged.

generation:
  schedule: empirical
  # Half the val split (19867 // 2): the n every set is cut to in `evaluate_sets`,
  # so the generated set is used whole in every halving.
  n_samples: 9933
  seed: 0
  std_correction: 1.0
  batch_size: 128
  output_root: results/samples

evaluation:
  # The networks' forward passes are the cost here, not the metrics.
  batch_size: 128
  results_root: results
  # Random halvings of the val set: the reference half, and the real-vs-real floor.
  halvings: 5
  set_metrics: [fid, kid, precision, recall, cmmd]

# Still missing, and worth adding before the writeup:
#   - attribute accuracy: does a sample conditioned on `Smiling` actually smile? Needs a
#     multi-label attribute classifier, the CelebA analogue of the digit judge.
#   - the calibration metric from `evaluate_marginal`, which needs that same judge to
#     read attributes back off the pixels.
