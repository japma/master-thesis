type: cspn

dataset:
  name: coco
  channels: 3
  height: 128
  width: 128
  num_classes: 80

autoencoder:
  name: "madebyollins/taesd"
  external: true

model:
  model_type: "psinet"
  num_repetitions: 5
  num_input_distributions: 10
  num_sums: 10
  min_var: 0.001
  max_var: 1.0
  h_dims: [ 128, 128 ]

training:
  epochs: 250
  learning_rate: 0.001
  batch_size: 32

wandb:
  mode: online
  project: master-thesis
  entity: jmartini-tu-darmstadt