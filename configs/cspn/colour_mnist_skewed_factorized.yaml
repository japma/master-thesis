# colour-MNIST, skewed variant.
#
# All 180 combinations appear, but digit 0 is red 45% of the time (weight 4x versus the
# other foregrounds); every other digit stays uniform. It asks whether a model picks up a
# colour prior nobody told it about.
#
# Note for evaluation: no combination has zero weight, so `seen_mask` is all-True and the
# held-out column of an eval report is empty here by design.

type: cspn

dataset:
  name: colour_mnist_skewed

autoencoder:
  name: "variational_colour_mnist_skewed"
  external: false
  tag: "latest"

model:
  model_type: "psinet"
  num_vars: 16
  num_repetitions: 3
  num_input_distributions: 8
  num_sums: 8
  min_var: 0.001
  max_var: 4.0
  h_dims: [ 256, 128 ]
  conditioning_type: factorized
  encoder_config:
    encoder_type: multi_categorical
    # classes, fg colours, bg colours
    num_classes: [ 10, 6, 3 ]

training:
  epochs: 200
  learning_rate: 0.0003
  batch_size: 128
  early_stopping_patience: 10
  early_stopping_min_delta: 0.01
