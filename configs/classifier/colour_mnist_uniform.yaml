# The fixed judge the generation metrics score samples with: digit, fg and bg heads.

type: classifier

dataset:
  name: colour_mnist_uniform

model:
  cardinalities: [ 10, 6, 3 ]
  names: [ digit, fg, bg ]
  channels: 3
  image_size: 28
  conv_channels: [ 32, 32, 64 ]
  hidden_dim: 128
  dropout: 0.25

training:
  epochs: 100
  learning_rate: 0.001
  batch_size: 256
