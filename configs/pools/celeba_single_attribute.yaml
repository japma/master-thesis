# CelebA with a single binary attribute (Male); otherwise as celeba.yaml. Every model
# is conditioned on the val labels, one sample per val image in the same order.
#
#   uv run generate_pools configs/pools/celeba_single_attribute.yaml
#   uv run evaluate_sets  configs/pools/celeba_single_attribute.yaml
#
# No `classifier:`: there is no attribute judge yet, so `evaluate_samples` does not
# apply. The set metrics say the images look like CelebA (and, with recall, cover it);
# they say nothing about whether a sample carries its attributes. That needs a
# multi-label attribute classifier, the CelebA analogue of the digit judge.

type: pools

dataset:
  name: celeba_single_attribute

models:
  - { type: cspn, name: psinet_celeba_single_attribute }

generation:
  labels: real
  seeds: [0]
  batch_size: 128

evaluation:
  # The networks' forward passes are the cost here, not the metrics.
  batch_size: 128
  results_root: results
  halvings: 5
  set_metrics: [fid, kid, precision, recall, cmmd]
