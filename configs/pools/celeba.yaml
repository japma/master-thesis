# The CelebA pool. Every model is conditioned on the val labels, one sample per val
# image in the same order, so the generated set carries exactly the real set's labels.
#
#   uv run generate_pools configs/pools/celeba.yaml
#   uv run evaluate_sets  configs/pools/celeba.yaml
#
# No `classifier:`: there is no attribute judge yet, so `evaluate_samples` does not
# apply. The set metrics say the images look like CelebA (and, with recall, cover it);
# they say nothing about whether a sample carries its attributes. That needs a
# multi-label attribute classifier, the CelebA analogue of the digit judge.

type: pools

dataset:
  name: celeba

# The baselines ignore the labels (vae_prior, gmm, spn) or are not PCs (nn_baseline).
# The trained ones are named as their trainers derive it; `vae_prior` names the VAE
# itself, which also decodes it. `variational_celeba` holds several VAEs, so it follows
# the `best` alias every trainer's config uses -- `latest` could be a different one.
models:
  - { type: cspn, name: cspn_celeba_variational }
  - { type: vae_prior, name: variational_celeba, version: best }
  - { type: gmm, name: gmm_celeba_variational_k10 }
  - { type: spn, name: spn_celeba_variational }
  - { type: nn_baseline, name: nn_baseline_celeba_variational_deterministic }
  - { type: nn_baseline, name: nn_baseline_celeba_variational_mixture }

generation:
  labels: real
  seeds: [0]
  batch_size: 128

evaluation:
  # The networks' forward passes are the cost here, not the metrics.
  batch_size: 128
  results_root: results
  halvings: 5
  set_metrics: [fid, kid, precision, recall, cmmd]
