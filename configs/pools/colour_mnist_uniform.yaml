# The uniform colour-MNIST pool. See colour_mnist_skewed.yaml for how it is used.

type: pools

dataset:
  name: colour_mnist_uniform

models:
  - { type: cspn, name: cspn_colour_mnist_uniform_variational }
  - { type: cspn, name: cspn_colour_mnist_uniform_anchored }
  - { type: cspn, name: cspn_colour_mnist_uniform_supervised }
  - { type: joint_pc, name: joint_pc_colour_mnist_uniform_variational }
  - { type: joint_pc, name: joint_pc_colour_mnist_uniform_anchored }
  - { type: joint_pc, name: joint_pc_colour_mnist_uniform_supervised }
  - { type: joint_pc, name: joint_pc_colour_mnist_uniform_labels_digit_variational, labels: [digit] }
  - { type: joint_pc, name: joint_pc_colour_mnist_uniform_x2_variational }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_variational_deterministic }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_variational_mixture }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_anchored_deterministic }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_anchored_mixture }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_supervised_deterministic }
  - { type: nn_baseline, name: nn_baseline_colour_mnist_uniform_supervised_mixture }

classifier:
  name: digit_classifier_colour_mnist_uniform
  tag: latest

# The feature network of the *_classifier set metrics, apart from the judge.
set_features:
  name: digit_classifier_colour_mnist_uniform_features
  tag: latest

generation:
  labels: stratified
  n_per_cell: 100
  seeds: [0]
  batch_size: 256

evaluation:
  batch_size: 512
  results_root: results
  set_metrics: [ fd_classifier, kd_classifier, precision_classifier, recall_classifier ]

# Queries with factors left free, sampled into <pool>/marginal/ by generate_pools and
# scored by evaluate_marginal.
marginal:
  queries:
    - [0, -1, -1]
    - [5, -1, -1]
  n_per_query: 1000
