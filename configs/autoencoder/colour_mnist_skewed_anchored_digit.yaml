# colour-MNIST, skewed variant.
#
# All 180 combinations appear, but digit 0 is red 45% of the time (weight 4x versus the
# other foregrounds); every other digit stays uniform. It asks whether a model picks up a
# colour prior nobody told it about.
#
# Every factor anchored, digits included, on ten mutually orthogonal unit vectors.
# This is the one to watch for the joint PC: anchoring makes each factor
# mean-separated in the latent space, which is the only structure a Gaussian-leaf
# mixture conditions on well. Note latent_dim is 20 here, not 16 -- anything
# trained on it needs its latent size to match.
#
type: ae

dataset:
  name: colour_mnist_skewed

model:
  model_type: anchored
  # Distinguishes this from the colour-only anchored config, which is also
  # model_type: anchored on the same dataset.
  variant: digit
  latent_dim: 20
  num_blocks: 2
  base_channels: 32
  # Targets are [digit, fg, bg]; 4 of the 20 dimensions stay free for style.
  supervision:
    names: [digit, fg, bg]
    dims: [10, 3, 3]
    cardinalities: [10, 6, 3]
    anchors: [onehot, colour_mnist_fg, colour_mnist_bg]
    anchor_std: 0.1

training:
  vae_type: beta
  epochs: 100
  learning_rate: 0.0005
  batch_size: 128
  beta: 1.0
  beta_start: 0.0
  beta_end: 1.0
  kl_warmup_epochs: 10
  lambda_perceptual: 0.0
  # No cross-entropy left to balance against, so gamma weights the anchor KL directly.
  gamma_start: 0.0
  gamma_end: 1.0
  anchor_weight: 1.0
  classifier_warmup_epochs: 10
