# Colour-MNIST generation weights.
#
# Every (digit, foreground, background) cell starts at `default_weight`; each override
# assigns its `weight` to the cartesian product of the axes it names, and an omitted axis
# means "all values". Weights are relative and normalized per digit, so 0.0 is a held-out
# combination and e.g. 0.1 is one that appears a tenth as often as a 1.0 cell.

seed: 42
val_fraction: 0.1
default_weight: 1.0

overrides:
  - digits: [ 0 ]
    fg: [ cyan, yellow, pink ]
    weight: 0.0
  - digits: [ 1 ]
    bg: [ white, grey ]
    weight: 0.0
  - digits: [ 2 ]
    bg: [ black, grey ]
    weight: 0.0
