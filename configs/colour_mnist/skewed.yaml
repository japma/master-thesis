# Colour-MNIST generation weights — skewed variant (no held-out combinations).
#
# `default.yaml` zeroes out cells to create *unseen* combinations. This config instead
# keeps all 180 `(digit, fg, bg)` cells strictly positive and skews how often they appear,
# so the question shifts from "can the model compose a combination it never saw?" to
# "what does the model fall back to when a factor is left unspecified?". Sampling a digit
# without pinning its colours should reproduce that digit's training mode, not a uniform
# draw over colours.
#
# Every digit gets a signature foreground and a signature background, layered in three
# tiers (later overrides win on the cells they overlap):
#
#   1.0   baseline — every combination stays present
#   4.0   signature background, non-signature foregrounds
#  12.0   signature foreground, non-signature backgrounds
#  40.0   the signature pair itself
#
# Per digit that totals 40 + 2*12 + 5*4 + 10*1 = 94, so within a digit:
#
#   signature pair       40/94 = 42.6% of that digit's images
#   signature foreground 64/94 = 68.1%   (marginalizing over background)
#   signature background 60/94 = 63.8%   (marginalizing over foreground)
#   each of the 10 plain cells  1/94 =  1.1%
#
# Signature backgrounds are hand-assigned rather than `digit % 3` so foreground and
# background are not a deterministic function of one another across digits: red pairs with
# both white and grey, green with black and white, blue with white and black, cyan with
# grey.
#
# An alternative to `default.yaml`, not an addition: both write `data/colour-mnist`, so
# generating one replaces the other. That is cheap (~10s, and deterministic given `seed`),
# and `--verify` reports which design is currently on disk by checking the generating
# config's hash against the manifest.
#
#     uv run generate_colour_mnist configs/colour_mnist/skewed.yaml
#     uv run generate_colour_mnist configs/colour_mnist/skewed.yaml --check
#     uv run generate_colour_mnist configs/colour_mnist/skewed.yaml --verify

seed: 42
val_fraction: 0.1
default_weight: 1.0

overrides:
  # digit 0 — red on white
  - digits: [ 0 ]
    bg: [ white ]
    weight: 4.0
  - digits: [ 0 ]
    fg: [ red ]
    weight: 12.0
  - digits: [ 0 ]
    fg: [ red ]
    bg: [ white ]
    weight: 40.0

  # digit 1 — green on black
  - digits: [ 1 ]
    bg: [ black ]
    weight: 4.0
  - digits: [ 1 ]
    fg: [ green ]
    weight: 12.0
  - digits: [ 1 ]
    fg: [ green ]
    bg: [ black ]
    weight: 40.0

  # digit 2 — blue on white
  - digits: [ 2 ]
    bg: [ white ]
    weight: 4.0
  - digits: [ 2 ]
    fg: [ blue ]
    weight: 12.0
  - digits: [ 2 ]
    fg: [ blue ]
    bg: [ white ]
    weight: 40.0

  # digit 3 — cyan on grey
  - digits: [ 3 ]
    bg: [ grey ]
    weight: 4.0
  - digits: [ 3 ]
    fg: [ cyan ]
    weight: 12.0
  - digits: [ 3 ]
    fg: [ cyan ]
    bg: [ grey ]
    weight: 40.0

  # digit 4 — yellow on black
  - digits: [ 4 ]
    bg: [ black ]
    weight: 4.0
  - digits: [ 4 ]
    fg: [ yellow ]
    weight: 12.0
  - digits: [ 4 ]
    fg: [ yellow ]
    bg: [ black ]
    weight: 40.0

  # digit 5 — pink on white
  - digits: [ 5 ]
    bg: [ white ]
    weight: 4.0
  - digits: [ 5 ]
    fg: [ pink ]
    weight: 12.0
  - digits: [ 5 ]
    fg: [ pink ]
    bg: [ white ]
    weight: 40.0

  # digit 6 — red on grey
  - digits: [ 6 ]
    bg: [ grey ]
    weight: 4.0
  - digits: [ 6 ]
    fg: [ red ]
    weight: 12.0
  - digits: [ 6 ]
    fg: [ red ]
    bg: [ grey ]
    weight: 40.0

  # digit 7 — green on white
  - digits: [ 7 ]
    bg: [ white ]
    weight: 4.0
  - digits: [ 7 ]
    fg: [ green ]
    weight: 12.0
  - digits: [ 7 ]
    fg: [ green ]
    bg: [ white ]
    weight: 40.0

  # digit 8 — blue on black
  - digits: [ 8 ]
    bg: [ black ]
    weight: 4.0
  - digits: [ 8 ]
    fg: [ blue ]
    weight: 12.0
  - digits: [ 8 ]
    fg: [ blue ]
    bg: [ black ]
    weight: 40.0

  # digit 9 — cyan on grey
  - digits: [ 9 ]
    bg: [ grey ]
    weight: 4.0
  - digits: [ 9 ]
    fg: [ cyan ]
    weight: 12.0
  - digits: [ 9 ]
    fg: [ cyan ]
    bg: [ grey ]
    weight: 40.0
