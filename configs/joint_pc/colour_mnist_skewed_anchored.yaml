# colour-MNIST skewed, on the colour-anchored latent space.
#
# fg and bg are mean-separated here, digit is not -- so this one should fix
# the bg failure and leave the digit failure in place. That is the point of running it.
#
# `variant` keeps this out of the joint_pc_colour_mnist_skewed collection: same model_type and dataset, but a
# different autoencoder means a different model, and `:latest` must not mix them.

type: joint_pc

dataset:
  name: colour_mnist_skewed

autoencoder:
  name: "anchored_colour_mnist_skewed"
  external: false
  tag: "latest"

model:
  num_latents: 16
  # digit, fg colour, bg colour
  label_cardinalities: [ 10, 6, 3 ]
  variant: "anchored"
  num_repetitions: 8
  num_input_distributions: 32
  num_sums: 32
  min_var: 0.0001
  max_var: 4.0
  normalize_latents: true

training:
  epochs: 200
  learning_rate: 0.001
  batch_size: 128
  early_stopping_patience: 10
  early_stopping_min_delta: 0.01
