# Joint PC over p(z, y): no conditioning hypernetwork, so the label-latent dependence
# has to come from mixture structure -- hence the larger sums/repetitions than
# configs/cspn/colour_mnist.yaml.

type: joint_pc

dataset:
  name: colour_mnist_uniform

autoencoder:
  name: "variational_colour_mnist_uniform"
  external: false
  tag: "latest"

model:
  num_latents: 16
  # digit, fg colour, bg colour
  label_cardinalities: [ 10, 6, 3 ]
  num_repetitions: 8
  num_input_distributions: 32
  num_sums: 32
  min_var: 0.0001
  max_var: 4.0
  normalize_latents: true

training:
  epochs: 200
  learning_rate: 0.001
  batch_size: 128
  early_stopping_patience: 10
  early_stopping_min_delta: 0.01
