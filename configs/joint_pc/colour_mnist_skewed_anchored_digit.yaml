# colour-MNIST skewed, on the fully anchored latent space.
#
# The one that should actually help: a Gaussian-leaf mixture conditions by
# picking components with different means, and anchoring makes every factor
# mean-separated. Measured on the variational space the joint PC got digit 0.24 / bg
# 0.46 while the CSPN got 0.89 / 0.96.

type: joint_pc

dataset:
  name: colour_mnist_skewed

autoencoder:
  name: "anchored_colour_mnist_skewed_digit"
  external: false
  tag: "latest"

model:
  num_latents: 20
  # digit, fg colour, bg colour
  label_cardinalities: [ 10, 6, 3 ]
  num_repetitions: 8
  num_input_distributions: 32
  num_sums: 32
  min_var: 0.0001
  max_var: 4.0
  normalize_latents: true

training:
  epochs: 200
  learning_rate: 0.001
  batch_size: 128
  early_stopping_patience: 10
  early_stopping_min_delta: 0.01
