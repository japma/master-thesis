# colour-MNIST uniform, joint PC on the colour-anchored latent space: fg and bg are
# mean-separated here, the digit is not.

type: joint_pc

dataset:
  name: colour_mnist_uniform

autoencoder:
  name: "vae_colour_mnist_uniform_anchored"
  external: false
  tag: "latest"

model:
  num_latents: 16
  # digit, fg colour, bg colour
  label_cardinalities: [ 10, 6, 3 ]
  num_repetitions: 8
  num_input_distributions: 32
  num_sums: 32
  min_var: 0.0001
  max_var: 4.0
  normalize_latents: true

training:
  epochs: 200
  learning_rate: 0.001
  batch_size: 128
  early_stopping_patience: 10
  early_stopping_min_delta: 0.01
